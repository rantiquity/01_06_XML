name: Autograde R

on: 
  push:

permissions: 
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout student code
        uses: actions/checkout@v5
        
      - name: Fetch private tests
        uses: actions/checkout@v5
        with:
          repository: rantiquity/01_06_XML_Tests
          token: ${{ secrets.TESTS_DOWNLOAD_TOKEN }}  
          path: hidden_tests_dir
          
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
        
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
         packages: |
          any::dplyr
          any::purrr
          any::xml2
          any::testthat
         cache-version: ${{ hashFiles('hidden_tests_dir/test-hidden.R') }}
         dependencies: '"hard"'
         install-pandoc: false
         install-quarto: false
          
      - name: Run hidden tests
        shell: Rscript {0}
        run: |
          results <- testthat::test_file(
            "hidden_tests_dir/test-hidden.R",
            reporter = "summary"
          )

          results_df <- as.data.frame(results)

          failed <- sum(results_df$failed, na.rm = TRUE)
          errors <- sum(results_df$error, na.rm = TRUE)
          warnings <- sum(results_df$warning, na.rm = TRUE)
          skipped <- sum(results_df$skipped, na.rm = TRUE)
          passed <- sum(results_df$passed, na.rm = TRUE)

          cat("\n")
          cat("=====================================\n")
          cat(sprintf(
            "[ PASS %d | FAIL %d | ERROR %d | WARN %d | SKIP %d ]\n",
               passed, failed, errors, warnings, skipped
             ))
             
          if (failed == 0 && errors == 0) {
            cat("🎉 Отлично! Все проверки успешно пройдены.\n")
          } else {
            cat("❌ Некоторые проверки не пройдены.\n")
            cat("Прокрутите журнал выше — там указано, какие именно проверки завершились ошибкой.\n")
            
            quit(status = 1)
          }

          cat("=====================================\n")
    
